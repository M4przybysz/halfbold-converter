<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>HalfBold Converter</title>
</head>
<body>
    <header class="header">
        <h1>Half<span class="unbold">Bold Converter</span></h1>
    </header>

    <main>
        <div id="top">
            <div id="input"><label for="inputText">Input text:</label> <br>
            <textarea name="inputText" id="inputText" rows="10" cols="50"></textarea></div>

			<div id="middle"><label for="inputType">Input type:</label>
			<select name="inputType" id="inputType">
				<option value="plaintext">Plain text</option>
				<option value="html">HTML</option>
				<option value="markdown">Markdown</option>
			</select> 
			<br>

            <label for="boldingPercentage">Bolding percentage</label>
            <input type="range" name="boldingPercentage" id="boldingPercentage" min="5" max="75" step="5"> <br>

            <label for="markingColor">Marking color:</label>
            <input type="color" name="markingColor" id="markingColor"> <br>

            <input type="button" value=">>> Convert >>>"> </div>

           <div id="output"><label for="outputText">Output text:</label> <br>
            <textarea name="outputText" id="outputText" rows="10" cols="50" readonly></textarea></div>  <br><br>
        </div>
        <div id="bottom">
            Description 
            <br> <br>
            How to use
        </div>
    </main>

    <footer>
        <p>Copyright &copy; 2026 Maciej Przybył, Alina Osińska. Licensed under <a href="https://github.com/M4przybysz/halfbold-converter/blob/main/LICENSE">MIT License</a>.</p>
        <p>GitHub repository: <a href="https://github.com/M4przybysz/halfbold-converter">halfbold-converter</a></p>
    </footer>

    <script src="converter.js"></script>
</body>
</html>
