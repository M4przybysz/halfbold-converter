<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>HalfBold Converter</title>
</head>
<body>
    <header>
        <h1>Half<span class="unbold">Bold Converter</span></h1>
    </header>

    <main>
        <div id="top">
            <div id="input">
                <label for="inputText">Input text:</label> <br>
                <textarea name="inputText" id="inputText"></textarea>
            </div>

			<div id="middle">
                <div class="inputPair">
                    <label for="inputType">Input type:</label>
                    <select name="inputType" id="inputType">
                        <option value="PLAIN_TEXT">Plain text</option>
                        <option value="HTML">HTML</option>
                        <option value="MARKDOWN">Markdown</option>
                    </select> 
                </div>
			    <br>
                <div class="inputPair">
                    <label for="boldingPercentage">Bolding percentage:</label>
                    <input type="range" name="boldingPercentage" id="boldingPercentage" min="0.05" max="0.75" step="0.05" value="0.5" oninput="outputBoldingPercentage(this.value)"> 
                    <label for="boldingPercentage" id="boldingPercentageOutput">50%</label> 
                </div>
                <br>
                <div class="inputPair">
                    <label for="markingColor">Marking color:</label>
                    <input type="color" name="markingColor" id="markingColor">
                </div>
                <br>
                <input type="button" value=">>> Convert >>>" id="convertButton" onclick="convertText()"> 
            </div>

            <div id="output">
                <label for="outputText">Output text:</label> <br>
                <textarea name="outputText" id="outputTextarea" class="outputText"readonly></textarea>
                <div id="outputDiv" class="outputText"></div>
            </div>
            <br><br>
        </div>

        <div id="bottom">
            Description 
            <br> <br>
            How to use
        </div>
    </main>

    <footer>
        <span>
            Copyright &copy; 2026 Maciej Przybył, Alina Osińska. Licensed under <a href="https://github.com/M4przybysz/halfbold-converter/blob/main/LICENSE">MIT License</a>. <br>
            GitHub repository: <a href="https://github.com/M4przybysz/halfbold-converter">halfbold-converter</a>
        </span>
    </footer>

    <script src="./converter.js"></script>
</body>
</html>
